[package]
name = "xsa"
version = "0.1.0"
edition = "2021"
description = "xsa - chi sa. Suffixient-array tools over r-space artifacts (.ri4, .sA, rlbwt)."
license = "MIT"

[[bin]]
name = "xsa"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
rayon = "1.11"
flate2 = "1.1"
memmap2 = "0.9"
serde_json = "1.0"
tiny_http = "0.12"
tempfile = "3.23"
